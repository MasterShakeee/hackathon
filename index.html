<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HACKATHON — Buketov University</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Фирменная тема: сине-зелёная, одинаковая в светлом и тёмном режиме */
:root{--bg:#1620c4;--bg2:#0b1080;--neon:#39ff14;--dk:#0d6b25;--line:rgba(0,0,60,.5);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:#fff;font:400 17px/1.6 Rubik,system-ui,sans-serif;overflow-x:hidden}
.px,h1,h2,h3,.btn{font-family:'Press Start 2P',monospace;font-weight:400}
.grid{position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/40px 40px,radial-gradient(ellipse at 50% 25%,#2b38f0,var(--bg) 50%,var(--bg2));animation:drift 6s linear infinite}
@keyframes drift{to{background-position:0 40px,40px 0,0 0}}
.dot{position:fixed;top:0;z-index:-1;background:var(--neon);opacity:.6;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(105vh)}to{transform:translateY(-10vh)}}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;width:100%}
.hero{min-height:100svh;display:flex;flex-direction:column;padding:16px 0 24px;overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px}
.logo{background:#fff;border-radius:50%;padding:5px;box-shadow:4px 4px 0 var(--dk)}
.logo img{display:block;height:clamp(64px,9vw,96px);width:auto}
.uni{color:var(--neon);font-size:clamp(8px,1.6vw,14px);text-align:center}
.lang{display:flex;gap:6px}
.lang button{font:inherit;font-size:11px;padding:8px 10px;background:transparent;color:var(--neon);border:2px solid var(--neon);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--neon);color:#031}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.stage{position:relative;flex:1;min-height:clamp(300px,48vw,520px);perspective:1000px}
.par{position:absolute;transform-style:preserve-3d;will-change:transform}
.tp{inset:0;display:grid;place-items:center}
h1{margin:0;font-size:clamp(36px,10.5vw,140px);line-height:.98;text-align:center;text-shadow:1px 1px 0 #2bd94a,2px 2px 0 #2bd94a,3px 3px 0 #1da53a,4px 4px 0 #1da53a,5px 5px 0 var(--dk),6px 6px 0 var(--dk),7px 7px 0 var(--dk),14px 18px 28px rgba(0,0,40,.6)}
h1 span{display:block}
.hlp{left:-1%;top:34%;width:min(40vw,520px)}
.hrp{right:-1%;top:38%;width:min(38vw,500px)}
.bp{inset:0;display:grid;place-items:center;pointer-events:none}
.hand{display:block;width:100%;height:auto}
.hl{animation:inL 1.2s cubic-bezier(.2,.8,.2,1) both,reachL 5s ease-in-out 1.2s infinite;filter:drop-shadow(0 0 18px rgba(57,255,20,.5))}
.hr{animation:inR 1.2s cubic-bezier(.2,.8,.2,1) both,reachR 5.5s ease-in-out 1.2s infinite;filter:drop-shadow(0 0 18px rgba(255,255,255,.45))}
@keyframes inL{from{transform:translateX(-80%);opacity:0}}
@keyframes inR{from{transform:translateX(80%);opacity:0}}
@keyframes reachL{50%{transform:translate(4%,-3%) rotate(1.5deg)}}
@keyframes reachR{50%{transform:translate(-4%,3%) rotate(-1.5deg)}}
.brain{display:block;width:clamp(80px,14vw,175px);height:auto;animation:float 4s ease-in-out infinite,glow 2s ease-in-out infinite alternate}
@keyframes float{50%{transform:translateY(-14px) rotate(4deg)}}
@keyframes glow{from{filter:drop-shadow(0 0 8px rgba(57,255,20,.4))}to{filter:drop-shadow(0 0 24px rgba(57,255,20,.95))}}
.tag{text-align:center;margin:8px 20px 20px;font-size:clamp(15px,2.2vw,20px);color:#dfe4ff}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;padding:0 20px}
.btn.alt{background:transparent;color:var(--neon);border-color:var(--neon);box-shadow:0 6px 0 var(--dk);animation:none}
.btn{display:inline-block;background:var(--neon);color:#031;padding:18px 26px;font-size:clamp(10px,2.6vw,16px);line-height:1.5;text-decoration:none;border:3px solid #fff;box-shadow:0 6px 0 var(--dk),0 0 30px rgba(57,255,20,.6);transition:transform .1s,box-shadow .1s;animation:pulse 2s ease-in-out infinite;max-width:100%}
.btn::after{content:' >>'}
.btn:hover{animation:none;transform:translateY(3px);box-shadow:0 3px 0 var(--dk),0 0 40px rgba(57,255,20,.9)}
.btn:active{transform:translateY(6px);box-shadow:0 0 0 var(--dk)}
@keyframes pulse{50%{box-shadow:0 6px 0 var(--dk),0 0 52px rgba(57,255,20,.95)}}
.info{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px 24px;margin-top:34px;color:var(--neon);font-size:clamp(9px,1.5vw,13px);line-height:1.8}
.info div{flex:1 1 200px}.info div:nth-child(2){text-align:center}.info div:last-child{text-align:right}.info span{color:#fff}
section{padding:clamp(48px,8vw,96px) 0}
h2{font-size:clamp(16px,3.4vw,30px);line-height:1.4;color:var(--neon);margin:0 0 28px;text-shadow:3px 3px 0 var(--dk)}
.panel{background:rgba(5,10,90,.72);border:3px solid var(--neon);padding:22px;box-shadow:6px 6px 0 var(--dk);backdrop-filter:blur(4px);transition:transform .15s ease-out}
.cards,.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.panel h3{font-size:13px;line-height:1.7;margin:0 0 10px;color:var(--neon)}
.panel p{margin:0;color:#dfe4ff}
.num{display:block;font:400 28px 'Press Start 2P',monospace;text-shadow:3px 3px 0 var(--dk);margin-bottom:12px}
.lead{max-width:760px;font-size:clamp(17px,2vw,20px);margin:0 0 32px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,22px);max-width:760px;margin:0 auto}
.cd .panel{text-align:center;padding:clamp(12px,2.5vw,26px) 4px}
.cd b{display:block;font:400 clamp(20px,6vw,56px) 'Press Start 2P',monospace;text-shadow:3px 3px 0 var(--dk);margin-bottom:8px}
.cd small{font:400 clamp(6px,1.4vw,11px) 'Press Start 2P',monospace;color:var(--neon)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:end}
.podium .panel:nth-child(1){order:2;padding-block:48px;background:rgba(8,40,40,.8)}
.podium .panel:nth-child(2){order:1}
.bd{display:inline-grid;place-items:center;min-width:56px;height:56px;padding:0 8px;background:var(--neon);color:#031;font:400 14px 'Press Start 2P',monospace;margin-bottom:14px;box-shadow:4px 4px 0 var(--dk)}
.note{margin:22px 0 0;color:#b9c2ff;font-size:15px}
.final{text-align:center}.final h2{margin-bottom:16px}.final p{margin:0 0 30px}
footer{text-align:center;padding:28px 20px 40px;color:#b9c2ff;font-size:14px;border-top:2px dashed rgba(57,255,20,.5)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
@media(max-width:600px){.uni{display:none}.info div,.info div:last-child{text-align:center}.podium{grid-template-columns:1fr}.podium .panel{order:0!important;padding-block:22px!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style></head>

 const pars=[...document.querySelectorAll('.par')];let tx=0,ty=0,cx=0,cy=0,last=-9e3;
 addEventListener('pointermove',e=>{tx=e.clientX/innerWidth*2-1;ty=e.clientY/innerHeight*2-1;last=performance.now();
